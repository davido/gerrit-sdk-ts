name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The SDK is generated by the Java-based openapi-generator, invoked through npx,
      # so the regen step needs both a JDK and Node.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regen-drift gate: regenerate from the committed spec (generate.sh defaults to the
      # checked-in rest-api-openapi.json, so this is self-contained) and fail if the
      # committed SDK differs from a fresh regen.
      - name: Regenerate SDK from the committed spec
        run: ./generate.sh

      - name: Fail on regeneration drift
        run: git diff --exit-code

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
